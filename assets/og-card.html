<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4; --ink:#1C1A14; --ink-2:#3C382E; --ink-soft:#6E685A;
    --ipe:#E39A1E; --line:rgba(28,26,20,.16);
  }
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk",sans-serif;
    padding:74px 84px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  .top{display:flex;justify-content:space-between;align-items:center}
  .eyebrow{font-family:"Space Mono",monospace;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:14px}
  .eyebrow::before{content:"";width:34px;height:1px;background:var(--ink-soft)}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--ipe)}

  .mid{margin-top:6px}
  .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:132px;line-height:.9;letter-spacing:-.035em}
  .thesis{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:46px;line-height:1.16;letter-spacing:-.015em;margin-top:34px;max-width:19ch;color:var(--ink-2)}
  .mark{position:relative;white-space:nowrap;color:var(--ink)}
  .mark::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:7px;border-radius:4px;background:var(--ipe)}

  .bottom{display:flex;align-items:center;gap:18px;font-family:"Space Mono",monospace;font-size:21px;letter-spacing:.02em;color:var(--ink)}
  .bottom .sep{color:var(--ipe)}
  .bottom b{font-weight:400}
  .rule{position:absolute;left:84px;right:84px;bottom:118px;height:1px;background:var(--line)}
</style>
</head>
<body>
  <div class="top">
    <span class="eyebrow">Palmas, TO — desenvolvedor front-end</span>
    <span class="dot"></span>
  </div>

  <div class="mid">
    <div class="name">Tiago Quixaba</div>
    <div class="thesis">Do papel pra tela em <span class="mark">poucos dias</span>.</div>
  </div>

  <div class="rule"></div>
  <div class="bottom">
    <b>allmosso.com.br</b> <span class="sep">·</span> <b>+1.000 acessos por semana</b>
  </div>
</body>
</html>
